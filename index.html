          <a
            href="https://labs.google.com/search?source=hp&authuser=0"
            class="labicon"
            ,
            role="button"
          >
            <svg

              focusable="false"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
            >
              <path
                d="M209-120q-42 0-70.5-28.5T110-217q0-14 3-25.5t9-21.5l228-341q10-14 15-31t5-34v-110h-20q-13 0-21.5-8.5T320-810q0-13 8.5-21.5T350-840h260q13 0 21.5 8.5T640-810q0 13-8.5 21.5T610-780h-20v110q0 17 5 34t15 31l227 341q6 9 9.5 20.5T850-217q0 41-28 69t-69 28H209Zm221-660v110q0 26-7.5 50.5T401-573L276-385q-6 8-8.5 16t-2.5 16q0 23 17 39.5t42 16.5q28 0 56-12t80-47q69-45 103.5-62.5T633-443q4-1 5.5-4.5t-.5-7.5l-78-117q-15-21-22.5-46t-7.5-52v-110H430Z"

          </a>
        </div>

        <a
          href="https://accounts.google.com/ServiceLogin"
          class="sign-in-btn"
          target="_blank"
          >Sign in</a
        >
      </div>
    </header>

    <main class="main">
      <div class="logo">
        <img
          src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
          alt="Google"
          width="272"
          height="92"
        />
      </div>

      <form
        class="search-form"
        action="https://www.google.com/search"
        method="GET"
        id="google-search-form"
      >
        <div class="search-bar-container">
          <button
            type="submit"
            name="btnK"
            value="Google Search"
            class="search-icon-btn"
            aria-label="Google Search"
            title="Search"
          >
            🔍
          </button>

          <input
            type="text"
            name="q"
            class="search-input"
            autocomplete="off"
            autofocus
            placeholder="Search Google or type a URL"
          />
          <button
            type="button"
            class="mic-btn"
            id="voice-search-btn"
            aria-label="Search by voice"
            title="Voice search"
          >
            🎤
          </button>
        </div>

        <div class="action-buttons">
          <button
            type="submit"
            name="btnK"
            value="Google Search"
            class="search-btn"
          >
            Google Search
          </button>
          <button
            type="submit"
            name="btnI"
            value="I'm Feeling Lucky"
            class="lucky-btn"
          >
            I'm Feeling Lucky
          </button>
        </div>
      </form>
